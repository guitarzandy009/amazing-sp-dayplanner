<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazing SP Day Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Amazing Software Productions</h1>
        <h2>Day Planner</h2>
    </header>
    <section>
        <table>
            <caption>By Hour</caption>
            <thead>
                <tr>
                    <th scope="col">Hours</th>
                    <th scope="col">Tasks</th>
                    <th scope="col">Notes</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Hour 1</th>
                    <td>Breakfast / Shower</td>
                    <td></td>
                </tr>
                <tr>
                    <th scope="row">Hour 2</th>
                    <td>Social Media / Marketing</td>
                    <td></td>
                </tr>
                <tr>
                    <th scope="row">Hour 3</th>
                    <td>Customer Service</td>
                    <td></td>
                </tr>
                <tr>
                    <th scope="row">Hour 4</th>
                    <td>Development</td>
                    <td></td>
                </tr>
                <tr>
                    <th scope="row">Hour 5</th>
                    <td>Lunch</td>
                    <td></td>
                </tr>
                <tr>
                    <th scope="row">Hour 6</th>
                    <td>Development</td>
                    <td></td>
                </tr>
                <tr>
                    <th scope="row">Hour 7</th>
                    <td>Development</td>
                    <td></td>
                </tr>
                <tr>
                    <th scope="row">Hour 8</th>
                    <td>Development</td>
                    <td></td>
                </tr>
                <tr>
                    <th scope="row">Hour 9</th>
                    <td>Continuing Education</td>
                    <td></td>
                </tr>
                <tr>
                    <th scope="row">Hour 10</th>
                    <td>Dinner</td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </section>

</body>
</html>
